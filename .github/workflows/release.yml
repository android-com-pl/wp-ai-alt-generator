name: Release
on:
  release:
    types: [published]

env:
  HUSKY: 0

permissions:
  contents: read

jobs:
  deploy_to_wp_repository:
    name: Deploy to WP.org
    runs-on: ubuntu-latest
    environment:
      name: wp.org
      url: https://wordpress.org/plugins/${{ vars.PLUGIN_SLUG }}/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        name: 📥 Install JS dependencies
        with:
          runtime: node@24
          cache: true
          install: true
          require-lockfile: true

      - name: 🏗️ Build
        run: pnpm run build

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.1'
          coverage: none

      - name: 📥 Install PHP dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          require-lock-file: true
          composer-options: '--no-dev --ignore-platform-reqs --classmap-authoritative'

      - name: 🚀 WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ vars.PLUGIN_SLUG }}
